[pytest]
; Adds the project root to sys.path so `import app...` works regardless of
; the directory pytest is invoked from — tests/ has no __init__.py, so
; pytest's default import-path detection would otherwise only add tests/
; itself, not the project root.
pythonpath = .
testpaths = tests
asyncio_mode = auto
; The Motor client is created once in a session-scoped fixture, so every
; fixture AND every test must run on that same event loop — otherwise Motor
; raises "Future attached to a different loop" the moment a per-test loop
; tries to use a client built on an earlier, already-closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
